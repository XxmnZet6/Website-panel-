<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aimbot 70% Grafik MC</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* Background Login */
#loginPage{
    position:absolute;
    width:100%;
    height:100%;
    background:url('samurai.jpg') center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Background Menu */
#menuPage{
    position:absolute;
    width:100%;
    height:100%;
    background:url('samurai.jpg') center/cover no-repeat;
    display:none;
    justify-content:center;
    align-items:center;
}

.overlay{
    background:rgba(0,0,0,0.75);
    padding:30px;
    border-radius:20px;
    text-align:center;
    color:white;
    width:300px;
    backdrop-filter:blur(5px);
}

h1{
    margin-bottom:20px;
    color:red;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.switch{
    margin-top:20px;
}

.toggle{
    width:70px;
    height:35px;
    background:#444;
    border-radius:30px;
    position:relative;
    margin:auto;
    cursor:pointer;
}

.toggle::before{
    content:'';
    position:absolute;
    width:28px;
    height:28px;
    background:white;
    border-radius:50%;
    top:3px;
    left:4px;
    transition:0.3s;
}

.toggle.active{
    background:limegreen;
}

.toggle.active::before{
    left:38px;
}

.status{
    margin-top:10px;
    color:#fff;
}
</style>
</head>
<body>

<div id="loginPage">
    <div class="overlay">
        <h1>Aimbot 70%</h1>
        <input type="password" id="password" placeholder="Masukkan Password">
        <button onclick="login()">LOGIN</button>
    </div>
</div>

<div id="menuPage">
    <div class="overlay">
        <h1>Menu Aimbot</h1>

        <div class="switch">
            <div class="toggle" id="toggleBtn" onclick="toggleAimbot()"></div>
            <div class="status" id="status">NONAKTIF</div>
        </div>
    </div>
</div>

<audio id="onSound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3"></audio>
<audio id="offSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>
function login(){
    const pass = document.getElementById('password').value;

    if(pass === 'kadutgmg'){
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('menuPage').style.display = 'flex';
    }else{
        alert('Password Salah');
    }
}

function toggleAimbot(){
    const toggle = document.getElementById('toggleBtn');
    const status = document.getElementById('status');

    toggle.classList.toggle('active');

    if(toggle.classList.contains('active')){
        status.innerText = 'AKTIF';
        document.getElementById('onSound').play();
    }else{
        status.innerText = 'NONAKTIF';
        document.getElementById('offSound').play();
    }
}
</script>

</body>
</html>
