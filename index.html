<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aimbot 70%</title>
<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:url('URL_GAMBAR_KAMU') no-repeat center center/cover;
    color:white;
}

.box{
    width:320px;
    background:rgba(0,0,0,0.7);
    padding:20px;
    border-radius:15px;
    margin:60px auto;
    box-shadow:0 0 15px cyan;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:cyan;
    color:black;
    font-weight:bold;
}

.menu{
    display:none;
}

.toggle{
    display:flex;
    justify-content:space-between;
    background:#111;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
}

.clock{
    text-align:center;
    margin-top:10px;
    font-size:18px;
    color:cyan;
}
</style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>LOGIN PANEL</h2>

    <div class="clock" id="clock"></div>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>
</div>

<div class="box menu" id="menuBox">
    <h2>AIMBOT 70%</h2>

    <div class="clock" id="clock2"></div>

    <div class="toggle">
        <span>Module Gacor No Lag</span>
        <input type="checkbox">
    </div>

    <div class="toggle">
        <span>Aim Body</span>
        <input type="checkbox">
    </div>

    <div class="toggle">
        <span>Grafik Minecraft</span>
        <input type="checkbox">
    </div>

    <div class="toggle">
        <span>60 FPS Boost</span>
        <input type="checkbox">
    </div>

    <div id="adminPanel" style="display:none; margin-top:20px;">
        <h3>ADMIN PANEL</h3>

        <input type="text" id="newUser" placeholder="Buat Username Baru">
        <input type="password" id="newPass" placeholder="Buat Password Baru">

        <button onclick="buatAkun()">BUAT AKUN</button>
    </div>
</div>

<script>
// akun default
if(!localStorage.getItem('accounts')){
    localStorage.setItem('accounts', JSON.stringify([
        {user:'70', pass:'70'}
    ]));
}

function login(){
    let u = document.getElementById('username').value;
    let p = document.getElementById('password').value;

    let akun = JSON.parse(localStorage.getItem('accounts'));

    let cocok = akun.find(a => a.user === u && a.pass === p);

    if(cocok){
        localStorage.setItem('login','true');
        localStorage.setItem('userlogin',u);

        document.getElementById('loginBox').style.display='none';
        document.getElementById('menuBox').style.display='block';

        // admin panel muncul kalau admin
        if(u === '70' && p === '70'){
            document.getElementById('adminPanel').style.display='block';
        }

        alert('Login berhasil');
    } else {
        alert('Username atau password salah');
    }
}

function buatAkun(){
    let nu = document.getElementById('newUser').value;
    let np = document.getElementById('newPass').value;

    if(nu === '' || np === ''){
        alert('Isi username dan password');
        return;
    }

    let akun = JSON.parse(localStorage.getItem('accounts'));

    akun.push({user:nu, pass:np});

    localStorage.setItem('accounts', JSON.stringify(akun));

    alert('Akun baru berhasil dibuat');
}

// auto login
if(localStorage.getItem('login') === 'true'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('menuBox').style.display='block';

    let user = localStorage.getItem('userlogin');

    if(user === '70'){
        document.getElementById('adminPanel').style.display='block';
    }
}

// jam hari menit
function updateClock(){
    let now = new Date();

    let hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

    let text = hari[now.getDay()] + ', ' +
        now.getHours().toString().padStart(2,'0') + ':' +
        now.getMinutes().toString().padStart(2,'0') + ':' +
        now.getSeconds().toString().padStart(2,'0');

    document.getElementById('clock').innerHTML = text;
    document.getElementById('clock2').innerHTML = text;
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
