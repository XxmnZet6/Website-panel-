<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webb Kingzetz - Panel Kontrol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e, #0b1525);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container, .panel-container {
            background: rgba(10, 20, 30, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            transition: all 0.3s;
        }

        h1 {
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-size: 28px;
        }

        h2 {
            color: #ffaa44;
            margin-bottom: 20px;
            font-size: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1e2a3a;
            border: 1px solid #0ff;
            border-radius: 40px;
            color: #0ff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        button {
            background: #0ff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            background: #0aa;
            box-shadow: 0 0 12px #0ff;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .feature-btn {
            background: #111c26;
            border: 1px solid #0ff;
            color: #0ff;
            padding: 14px;
            border-radius: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .feature-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 15px #0ff;
        }

        .success-msg {
            margin-top: 20px;
            color: #0f0;
            background: #0f0a1a;
            border-left: 5px solid #0f0;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            animation: fade 2s ease;
        }

        @keyframes fade {
            0% { opacity: 0; transform: translateY(-10px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .grafik-area {
            margin-top: 20px;
            background: #00000066;
            border-radius: 20px;
            padding: 10px;
        }

        canvas {
            background: #0a0f1e;
            border-radius: 16px;
            width: 100%;
            height: auto;
            border: 1px solid #0ff;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #0ff77a;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Login Panel -->
    <div id="loginPanel" class="login-container">
        <h1>⚡ WEBB KINGZETZ ⚡</h1>
        <h2>🔐 MASUKKAN PASSWORD</h2>
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="login()">Akses Panel</button>
        <div class="footer">© Kingzetz Security Suite</div>
    </div>

    <!-- Main Panel (hidden initially) -->
    <div id="mainPanel" class="panel-container" style="display: none;">
        <h1>👑 KING ZETZ PANEL 👑</h1>
        <div class="feature-grid">
            <div class="feature-btn" onclick="activateFeature('GRAFIK MC')">📊 GRAFIK MC</div>
            <div class="feature-btn" onclick="activateFeature('AIM BOT')">🎯 AIM BOT</div>
            <div class="feature-btn" onclick="activateFeature('AIM NECK')">🎯 AIM NECK</div>
            <div class="feature-btn" onclick="activateFeature('AIM BADAN')">💪 AIM BADAN</div>
        </div>

        <!-- Grafik sederhana (simulasi) -->
        <div class="grafik-area">
            <canvas id="mcChart" width="400" height="150" style="width:100%; height:auto; max-width:400px; margin:0 auto; display:block;"></canvas>
            <div class="footer" style="margin-top: 8px;">📈 Statistik MC Real-time</div>
        </div>

        <div id="messageArea"></div>
        <button onclick="logout()" style="background:#aa3344; margin-top: 15px;">🔓 Logout</button>
        <div class="footer">⚡ Success Active Panel King Zetz</div>
    </div>
</div>

<script>
    // Password yang benar
    const CORRECT_PASSWORD = "kadut";

    function login() {
        const inputPass = document.getElementById('passwordInput').value;
        if (inputPass === CORRECT_PASSWORD) {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
            drawGrafikMC(); // gambar grafik awal
        } else {
            alert("❌ PASSWORD SALAH! Akses ditolak.");
        }
    }

    function logout() {
        document.getElementById('loginPanel').style.display = 'block';
        document.getElementById('mainPanel').style.display = 'none';
        document.getElementById('passwordInput').value = '';
        document.getElementById('messageArea').innerHTML = '';
    }

    function activateFeature(featureName) {
        // Menampilkan pesan sukses sesuai permintaan
        const msgDiv = document.getElementById('messageArea');
        msgDiv.innerHTML = `<div class="success-msg">✅ SUCCESS ACTIVE PANEL KING ZETZ — ${featureName} ACTIVATED</div>`;
        
        // Efek tambahan sesuai fitur
        if (featureName === "GRAFIK MC") {
            drawGrafikMC(true); // refresh dengan animasi
        } else if (featureName === "AIM BOT") {
            console.log("Aim Bot aktif (simulasi)");
        } else if (featureName === "AIM NECK") {
            console.log("Aim Neck aktif");
        } else if (featureName === "AIM BADAN") {
            console.log("Aim Badan aktif");
        }

        // Hapus pesan setelah 2.5 detik
        setTimeout(() => {
            if (msgDiv.firstChild) msgDiv.removeChild(msgDiv.firstChild);
        }, 2500);
    }

    function drawGrafikMC(animate = false) {
        const canvas = document.getElementById('mcChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        canvas.width = w;
        canvas.height = h;

        // Data random simulasi untuk grafik MC (misal FPS / target)
        const dataPoints = [12, 19, 15, 22, 24, 28, 30, 27, 33, 40, 38, 42, 45, 50, 48, 55, 60, 58, 62, 65];
        
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = "#0ff";
        ctx.fillStyle = "#0ff";
        ctx.font = "10px monospace";
        ctx.fillText("GRAFIK PERFORMANCE MC", 10, 15);
        
        if (dataPoints.length < 2) return;
        
        const stepX = w / (dataPoints.length - 1);
        const maxVal = Math.max(...dataPoints, 1);
        const minVal = Math.min(...dataPoints, 0);
        const range = maxVal - minVal || 1;
        
        ctx.beginPath();
        let x = 0;
        let y = h - ((dataPoints[0] - minVal) / range) * (h - 30) - 15;
        ctx.moveTo(x, y);
        
        for (let i = 1; i < dataPoints.length; i++) {
            x = i * stepX;
            y = h - ((dataPoints[i] - minVal) / range) * (h - 30) - 15;
            ctx.lineTo(x, y);
        }
        ctx.strokeStyle = "#0ff";
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Area gradient
        ctx.lineTo(x, h - 15);
        ctx.lineTo(0, h - 15);
        ctx.fillStyle = "rgba(0, 255, 255, 0.15)";
        ctx.fill();
        
        ctx.fillStyle = "#0ff";
        for (let i = 0; i < dataPoints.length; i++) {
            let xp = i * stepX;
            let yp = h - ((dataPoints[i] - minVal) / range) * (h - 30) - 15;
            ctx.beginPath();
            ctx.arc(xp, yp, 3, 0, 2 * Math.PI);
            ctx.fillStyle = "#0ff";
            ctx.fill();
        }
        
        if (animate) {
            // efek kedip kecil untuk menunjukkan refresh
            canvas.style.filter = "drop-shadow(0 0 6px cyan)";
            setTimeout(() => { canvas.style.filter = ""; }, 300);
        }
    }

    // Resize canvas saat window diubah
    window.addEventListener('resize', () => {
        if (document.getElementById('mainPanel').style.display === 'block') {
            drawGrafikMC();
        }
    });

    // Jika ingin auto-refresh grafik setiap 5 detik (opsional)
    let interval;
    function startAutoRefresh() {
        if (interval) clearInterval(interval);
        interval = setInterval(() => {
            if (document.getElementById('mainPanel').style.display === 'block') {
                drawGrafikMC();
            }
        }, 5000);
    }
    
    // Override sedikit agar saat panel muncul, auto refresh jalan
    const originalSetDisplay = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'style').set;
    // Biar simpel, kita panggil startAutoRefresh di login
    const oldLogin = login;
    window.login = function() {
        oldLogin();
        if (document.getElementById('mainPanel').style.display === 'block') {
            startAutoRefresh();
            drawGrafikMC();
        }
    };
    
    // Saat logout matikan interval
    const oldLogout = logout;
    window.logout = function() {
        if (interval) clearInterval(interval);
        oldLogout();
    };
    
    // Inisialisasi awal untuk canvas
    window.onload = () => {
        // sudah siap
    };
</script>

</body>
  </html>
